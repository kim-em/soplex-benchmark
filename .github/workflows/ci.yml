name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System deps (for the vendored SoPlex build via LP)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake build-essential ninja-build clang \
            libgmp-dev libgmpxx4ldbl libboost-dev \
            libc++-dev libc++abi-dev zstd
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: lean --version
      - name: Mathlib cache
        run: lake exe cache get
      - name: Build (sanity target)
        run: lake build
